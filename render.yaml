# ==============================================================================
#  Render Blueprint: EcoMemories Smart Kiosk Web Service & PostgreSQL Database
# ==============================================================================
services:
  - type: web
    name: ecomemories-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: EcoMemories
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: ecomemories-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: ecomemories-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database

databases:
  - name: ecomemories-db
    plan: free
    region: singapore
    databaseName: ecophotobooth_website
